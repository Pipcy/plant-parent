name: PlantParent
options:
  bundleIdPrefix: com.joharper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PlantParent:
    type: application
    platform: iOS
    sources:
      - PlantParent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joharper.PlantParent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plant Parent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take progress photos of your plants.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a photo for your plant.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - PlantParentTests
  PlantParentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlantParentTests
    dependencies:
      - target: PlantParent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joharper.PlantParentTests
        GENERATE_INFOPLIST_FILE: YES
